name: Frontend CI
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install
      - run: npm run build
      - run: npm run lint:eslint
      - run: npm run format:check
