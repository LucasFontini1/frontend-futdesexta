name: E2E Vue + Django
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/e2e.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DEBUG: 'true'
      SECRET_KEY: 'temporary-only-for-e2e'
      DATABASE_URL: 'sqlite:///db.sqlite3'
      FRONTEND_URLS: 'http://127.0.0.1:5173'
      VITE_API_BASE_URL: 'http://127.0.0.1:8000/api'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LucasFontini1/backend-futdesexta
          ref: feature/foundation-security-20261030
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: python -m pip install -r backend/requirements.txt
      - name: Inicializa banco de teste isolado
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py shell -c "from core.models import User; User.objects.create_user('e2e@example.com', 'Test-Pass-2026!', username='e2e_user', name='Teste E2E')"
          nohup python manage.py runserver 127.0.0.1:8000 > /tmp/fut-backend.log 2>&1 &
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Registra logs do Django se testes falharem
        if: failure()
        run: cat /tmp/fut-backend.log || true
